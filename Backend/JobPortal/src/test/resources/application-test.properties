# Test configuration with in-memory H2 database fallback
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-only-jwt-signing-secret-not-for-production-use-0123456789
jwt.expiration=3600000

cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-api-key
cloudinary.api-secret=test-api-secret

spring.mail.host=localhost
spring.mail.port=3025
app.email.from=test@example.com
app.email.name=JobPortal Test
